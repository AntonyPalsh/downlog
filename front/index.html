<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Загрузка логов</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">📥</text></svg>'>
</head>
<body>
  <div class="container">
    <h1>📥 Загрузка логов ЕДМ Test</h1>
    <h3>Загрузка логов Tomcat</h3>
    <p class="subtitle">Выберите дату и скачайте архив</p>

    <div class="row">
      <button id="btn-catalina">Catalina.out</button>
      <input type="date" id="date-catalina">
      <span class="status" id="status-catalina"></span>
    </div>

    <div class="row">
      <button id="btn-universe">Universe-backend</button>
      <input type="date" id="date-universe">
      <span class="status" id="status-universe"></span>
    </div>

    <h3>Загрузка логов сканеров</h3>
    <p class="subtitle">Выберите ID сканера или дату для log.txt и скачайте архив</p>

    <div class="row">
      <button id="btn-scaners">Scaners</button>
      <input type="text" id="scanid" placeholder="Введите ScanID">
      <span class="status" id="status-scaners"></span>
    </div>

    <div class="row">
      <button id="btn-scaners-formit">Scaners Formit</button>
      <input type="text" id="scanid-formit" placeholder="Введите ScanID">
      <span class="status" id="status-scaners-formit"></span>
    </div>

    <div class="row">
      <button id="btn-scaners-logtxt">Scaners Log.txt</button>
      <input type="date" id="scanid-logtxt" placeholder="Введите ScanID">
      <span class="status" id="status-scaners-logtxt"></span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
